      <path d="M222 114 C212 138, 206 160, 204 182"/>
      <path d="M259 138 C259 166, 257 196, 254 224"/>
      <path d="M294 112 C302 138, 308 162, 310 186"/>
      <path d="M330 102 C358 126, 376 172, 378 228"/>
    </g>

    <!-- Thin curved eyebrows visible right through bangs -->
    <path d="M174 220 Q198 207 222 216" fill="none" stroke="#151317" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M290 216 Q314 207 338 220" fill="none" stroke="#151317" stroke-width="3.4" stroke-linecap="round"/>
  </g>
</svg>
