    <!-- Vertical pink anime blush hatch lines -->
    <g stroke="#DC8C8C" stroke-width="3" stroke-linecap="round">
      <line x1="164" y1="319" x2="162" y2="337"/>
      <line x1="173" y1="317" x2="171" y2="342"/>
      <line x1="182" y1="318" x2="180" y2="344"/>
      <line x1="191" y1="317" x2="190" y2="342"/>
      <line x1="200" y1="319" x2="199" y2="339"/>
      <line x1="209" y1="321" x2="208" y2="336"/>

      <line x1="303" y1="321" x2="302" y2="336"/>
      <line x1="312" y1="319" x2="311" y2="339"/>
      <line x1="321" y1="317" x2="320" y2="342"/>
      <line x1="330" y1="318" x2="328" y2="344"/>
      <line x1="339" y1="317" x2="337" y2="342"/>
      <line x1="348" y1="319" x2="346" y2="337"/>
    </g>

    <!-- 45-degree tilted gimmicky blep mouth (right side tilted up, tongue poking out along the tilt) -->
    <g transform="rotate(-24 256 353)">
      <!-- Little pink tongue peeking out slightly right of center -->
      <path d="M251 348
               C249 367, 258 378, 269 376
               C279 374, 282 362, 275 349 Z"
