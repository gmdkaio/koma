    <path d="M104 244
             C100 134, 164 68, 256 68
             C348 68, 412 134, 408 244
             C406 314, 398 378, 384 422
             C362 414, 344 398, 334 378
             C310 388, 284 392, 256 392
             C228 392, 202 388, 178 378
             C168 398, 150 414, 128 422
             C114 378, 106 314, 104 244 Z"
