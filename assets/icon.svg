    <!-- White eye shapes behind dizzy spirals -->
    <ellipse cx="198" cy="276" rx="31" ry="29" fill="#FFFFFF"/>
    <ellipse cx="314" cy="276" rx="31" ry="29" fill="#FFFFFF"/>

    <!-- Bold hand-drawn dizzy spiral eyes (@_@) -->
