        <g fill="none" stroke="#151317" stroke-width="3.6" stroke-linecap="round">
          <path d="M182 104 C156 128, 138 172, 134 224"/><path d="M222 114 C212 138, 206 160, 204 182"/>
          <path d="M259 138 C259 166, 257 196, 254 224"/><path d="M294 112 C302 138, 308 162, 310 186"/>
          <path d="M330 102 C358 126, 376 172, 378 228"/>
        </g>
        <path d="M174 220 Q198 207 222 216" fill="none" stroke="#151317" stroke-width="3.4" stroke-linecap="round"/>
        <path d="M290 216 Q314 207 338 220" fill="none" stroke="#151317" stroke-width="3.4" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Vertically centered ink wordmark & subtitle (no tags) -->
    <text x="334" y="196" font-family="Space Grotesk, Adwaita Sans, sans-serif" font-weight="700" font-size="90" letter-spacing="-3" fill="#151317">koma</text>
    <text x="584" y="194" font-family="Noto Sans CJK JP, sans-serif" font-weight="700" font-size="22" letter-spacing="4" fill="#151317" fill-opacity="0.38">コマ</text>

    <text x="338" y="244" font-family="Adwaita Sans, sans-serif" font-weight="500" font-size="23" fill="#46403B">file transfer &amp; image stash for pc &amp; phone</text>
