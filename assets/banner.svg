          <line x1="182" y1="318" x2="180" y2="344"/><line x1="191" y1="317" x2="190" y2="342"/>
          <line x1="200" y1="319" x2="199" y2="339"/><line x1="209" y1="321" x2="208" y2="336"/>
          <line x1="303" y1="321" x2="302" y2="336"/><line x1="312" y1="319" x2="311" y2="339"/>
          <line x1="321" y1="317" x2="320" y2="342"/><line x1="330" y1="318" x2="328" y2="344"/>
          <line x1="339" y1="317" x2="337" y2="342"/><line x1="348" y1="319" x2="346" y2="337"/>
        </g>
        <path d="M251 346 C249 365, 258 377, 269 375 C279 373, 282 361, 275 349 Z"
