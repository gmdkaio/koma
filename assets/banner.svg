<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360">
  <defs>
    <clipPath id="mangaClip">
      <rect x="0" y="0" width="1280" height="360" rx="20"/>
    </clipPath>
    <clipPath id="innerFrameClip">
      <rect x="18" y="18" width="1244" height="324" rx="10"/>
    </clipPath>
    <pattern id="screentone" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="3" cy="3" r="1.4" fill="#151317" fill-opacity="0.11"/>
    </pattern>
  </defs>

  <g clip-path="url(#mangaClip)">
    <!-- Warm manga paper base -->
    <rect x="0" y="0" width="1280" height="360" fill="#F4EFE6"/>

    <!-- Everything inside the inner manga frame is clipped cleanly so fills never overlap the border stroke -->
    <g clip-path="url(#innerFrameClip)">
      <rect x="18" y="18" width="1244" height="324" fill="#FAF6EE"/>

      <!-- Right manga panel accent strip with subtle screentone -->
      <path d="M950 14 L1266 14 L1266 346 L886 346 Z" fill="#E8DFD1"/>
      <path d="M950 14 L1266 14 L1266 346 L886 346 Z" fill="url(#screentone)"/>
      <line x1="950" y1="14" x2="886" y2="346" stroke="#151317" stroke-width="4.5"/>

      <!-- Minimal manga panel grid graphic on right (uniform 3.5px ink borders, exact 12px gutters) -->
      <g transform="translate(972 56)">
        <rect x="0" y="0" width="118" height="106" fill="#FAF6EE" stroke="#151317" stroke-width="3.5"/>
        <rect x="130" y="0" width="110" height="106" fill="#72B4FA" fill-opacity="0.32" stroke="#151317" stroke-width="3.5"/>
        <rect x="0" y="118" width="154" height="130" fill="#FAF6EE" stroke="#151317" stroke-width="3.5"/>
        <rect x="166" y="118" width="74" height="130" fill="#FAF6EE" stroke="#151317" stroke-width="3.5"/>
        <text x="14" y="232" font-family="JetBrainsMono Nerd Font, Adwaita Mono, monospace" font-size="11.5" font-weight="600" fill="#151317" fill-opacity="0.72">koma_0001.png</text>
        <rect x="12" y="12" width="44" height="18" fill="#151317"/>
        <text x="19" y="25" font-family="JetBrainsMono Nerd Font, Adwaita Mono, monospace" font-size="10.5" font-weight="700" fill="#FAF6EE">#01</text>
      </g>
    </g>

    <!-- Uniform outer manga panel ink frame drawn on top of clipped fills -->
    <rect x="18" y="18" width="1244" height="324" rx="10" fill="none" stroke="#151317" stroke-width="4.5"/>

    <!-- Official Chinatsu Blep Icon -->
    <g transform="translate(86 76) scale(0.41)">
      <g transform="translate(256 264) scale(1.22) translate(-256 -248)">
        <path d="M104 244 C100 134, 164 68, 256 68 C348 68, 412 134, 408 244 C406 314, 398 378, 384 422 C362 414, 344 398, 334 378 C310 388, 284 392, 256 392 C228 392, 202 388, 178 378 C168 398, 150 414, 128 422 C114 378, 106 314, 104 244 Z"
