        <path d="M263 351 C263 357, 265 362, 267 366" fill="none" stroke="#B95D66" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M233 354 Q256 339 281 353" fill="none" stroke="#151317" stroke-width="4.8" stroke-linecap="round"/>
        <path d="M116 242 C114 140, 170 68, 256 68 C342 68, 398 140, 396 242 C394 304, 386 364, 368 416 L356 382 C346 404, 336 418, 328 422 C344 370, 356 312, 354 244 C346 262, 338 272, 332 272 C330 232, 320 192, 306 168 C304 202, 296 234, 282 252 C284 226, 284 196, 280 172 C272 214, 264 252, 254 268 C244 250, 236 216, 232 178 C228 206, 226 232, 228 248 C214 226, 206 196, 204 166 C192 198, 178 236, 170 264 C164 248, 160 228, 158 214 C156 296, 168 364, 184 422 C174 416, 164 402, 156 382 L144 416 C126 364, 118 304, 116 242 Z"
