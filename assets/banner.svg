        <ellipse cx="314" cy="276" rx="31" ry="29" fill="#FFFFFF"/>
        <path d="M167 268 C171 245, 202 241, 222 254 C236 266, 234 294, 212 303 C192 310, 173 298, 175 280 C177 265, 196 258, 209 266 C217 272, 214 286, 202 287 C194 287, 191 278, 198 274"
